name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build does not query the DB: dummy value satisfies Prisma's env check at import time
          DATABASE_URL: postgresql://ci:notused@localhost:5432/ci
          AUTH_SECRET: ci-secret-not-used-at-build-time
          AUTH_URL: http://localhost:3000

  e2e:
    name: e2e (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: awano
          POSTGRES_PASSWORD: awano
          POSTGRES_DB: awano_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://awano:awano@localhost:5432/awano_e2e
      AUTH_SECRET: e2e-secret-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply schema
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      # The suite provisions the data it needs, so no seed step runs here.
      - name: End-to-end tests
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: "!cancelled()"
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  e2e-report:
    name: e2e report
    if: "!cancelled()"
    needs: [e2e]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect the shards
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # One report for the whole run, instead of one per shard.
      - name: Merge into one report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
