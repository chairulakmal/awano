# Local PostgreSQL for Awano development.
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f db

services:
  db:
    image: postgres:16-alpine
    container_name: awano-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: awano
      POSTGRES_PASSWORD: awano
      POSTGRES_DB: awano
    volumes:
      - awano_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awano -d awano"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  awano_pg_data:
